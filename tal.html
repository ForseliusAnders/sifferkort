<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aktuellt tal</title>
<style>
  html, body { height: 100%; margin: 0; background: #111318; color: #f2f2f2;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; align-items: center; justify-content: center; overflow: hidden; }
  /* Fyller widgetytan oavsett storlek — siffran skalas med ytan. */
  .tal { font-size: min(46vw, 62vh); font-weight: 800; line-height: 0.9;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  body.ljus { background: #fff; color: #111318; }
  body.klar { background: transparent; }
</style>
</head>
<body>
<div class="tal" id="tal">–</div>
<script src="tid.js"></script>
<script>
  function rita() {
    document.getElementById('tal').textContent = aktuelltTal();
  }
  rita();
  // Byt i takt aven om widgeten haller sidan oppen lange.
  setTimeout(function tick() {
    rita();
    setTimeout(tick, msTillNasta());
  }, msTillNasta());
  var f = new URLSearchParams(location.search);
  if (f.has('ljus')) document.body.classList.add('ljus');
  if (f.has('klar')) document.body.classList.add('klar');
</script>
</body>
</html>
